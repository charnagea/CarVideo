name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        run: base64 -d keystore.b64 > app/carvideo.keystore

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease bundleRelease 2>&1 | tee build.log

      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk "out/CarVideo-Dash-${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/*.aab "out/CarVideo-Dash-${{ github.run_number }}.aab"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            APK: install directly on your phone. AAB: upload to Google Play Console (internal testing).
          files: |
            out/*.apk
            out/*.aab

      - name: Save build log on failure
        if: failure()
        run: |
          touch build.log
          mkdir /tmp/logs && cd /tmp/logs
          git init -q && git checkout -q -b ci-logs
          {
            echo "Run ${{ github.run_number }} failed"
            echo "==== errors ===="
            grep -n -E "error:|e: |What went wrong|FAILED|Could not|Exception" -A6 "$GITHUB_WORKSPACE/build.log" | head -400
            echo "==== tail ===="
            tail -200 "$GITHUB_WORKSPACE/build.log"
          } > build-log.txt
          git add build-log.txt
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build log ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
